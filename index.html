
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortnite Shop</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    padding: 55px 25px;
    background:
        radial-gradient(ellipse at 15% 20%, #063d3b 0%, transparent 40%),
        radial-gradient(ellipse at 90% 90%, #062b55 0%, transparent 45%),
        #080d15;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1200px;
    margin: auto;
}

/* RECHERCHE */

.search-container {
    max-width: 850px;
    margin: 0 auto 55px;
}

.search {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px 8px 25px;
    border-radius: 50px;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    box-shadow:
        inset 0 2px 5px rgba(255,255,255,.15),
        0 10px 35px rgba(0,0,0,.3);
}

.search input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 17px;
    padding: 16px 0;
}

.search input::placeholder {
    color: #c2cbd8;
}

.search button {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid #ffffff80;
    background: #168aff;
    color: white;
    font-size: 23px;
    cursor: pointer;
    transition: .2s;
}

.search button:hover {
    transform: scale(1.08);
}

/* RESULTAT */

#result {
    display: none;
    animation: appear .5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    align-items: center;
    gap: 30px;
}

/* SKIN */

.player {
    text-align: center;
}

.skin-circle {
    width: 185px;
    height: 185px;
    margin: auto;
    padding: 5px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00eaff, #147dff);
    box-shadow: 0 0 30px #008cff80;
}

.skin-circle img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #172c48;
}

.player-name {
    margin-top: 20px;
    font-size: 23px;
    font-weight: 900;
    overflow-wrap: anywhere;
}

.player-label {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #b7c8dd;
}

/* CARTES */

.offers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
}

.card {
    position: relative;
    min-width: 0;
    overflow: hidden;
    padding: 22px 15px;
    border-radius: 24px;
    text-align: center;
    border: 2px solid rgba(255,255,255,.65);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow:
        inset 0 2px 8px rgba(255,255,255,.35),
        0 12px 30px rgba(0,0,0,.3);
    transition: transform .3s, box-shadow .3s;
}

/* COULEURS UNIFORMES */

.card.green {
    background: #08b94f;
    box-shadow:
        inset 0 2px 12px #ffffff70,
        0 0 30px #00e96b70;
}

.card.blue {
    background: #087ce8;
    box-shadow:
        inset 0 2px 12px #ffffff70,
        0 0 30px #168cff70;
}

.card.orange {
    background: #f28a08;
    box-shadow:
        inset 0 2px 12px #ffffff70,
        0 0 30px #ff9b2070;
}

.card:hover {
    transform: translateY(-8px);
}

/* REFLET LIQUID GLASS */

.card::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;
    background: linear-gradient(
        110deg,
        transparent,
        rgba(255,255,255,.24),
        transparent
    );
    transform: skewX(-20deg);
    transition: .7s;
    pointer-events: none;
}

.card:hover::before {
    left: 150%;
}

.card img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 145px;
    object-fit: contain;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.25));
}

.card h2 {
    position: relative;
    z-index: 1;
    font-size: 18px;
    font-weight: 900;
    margin: 15px 0 20px;
    color: white;
    text-shadow: 0 2px 4px #0003;
}

/* PRIX */

.price {
    position: relative;
    z-index: 1;
    display: block;
    width: 100%;
    padding: 15px 5px;
    border-radius: 14px;
    color: white;
    text-decoration: none;
    font-size: 27px;
    font-weight: 900;
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.22);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
        inset 0 2px 8px rgba(255,255,255,.3),
        0 5px 15px rgba(0,0,0,.15);
    transition: .2s;
}

.price:hover {
    background: rgba(255,255,255,.38);
    transform: scale(1.04);
}

/* OFFRE COMPLETE */

.combined {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 145px;
}

.combined img {
    width: 43%;
    height: 125px;
}

.plus {
    font-size: 35px;
    font-weight: 900;
    color: white;
    text-shadow: 0 2px 5px #0004;
}

/* RESPONSIVE */

@media(max-width: 900px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .player {
        margin-bottom: 10px;
    }
}

@media(max-width: 650px) {
    body {
        padding: 25px 14px;
    }

    .offers {
        grid-template-columns: 1fr;
    }

    .card {
        display: grid;
        grid-template-columns: 120px 1fr;
        align-items: center;
        gap: 10px 15px;
        padding: 15px;
    }

    .card > img,
    .combined {
        grid-row: span 2;
    }

    .card > img {
        height: 110px;
    }

    .combined {
        height: 110px;
    }

    .combined img {
        height: 95px;
    }

    .card h2 {
        margin: 0;
        font-size: 16px;
    }

    .price {
        font-size: 23px;
        padding: 11px;
    }

    .skin-circle {
        width: 155px;
        height: 155px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="search-container">
        <form class="search" id="searchForm">
            <input
                type="text"
                id="pseudo"
                placeholder="Rechercher un pseudo Fortnite..."
                autocomplete="off"
                maxlength="30"
                required
            >
            <button type="submit">➜</button>
        </form>
    </div>

    <section id="result">

        <div class="layout">

            <div class="player">

                <div class="skin-circle">
                    <img
                        src="https://pbs.twimg.com/media/HEPyt5tagAApJHd?format=jpg&name=small"
                        alt="Skin Fortnite"
                    >
                </div>

                <div class="player-name" id="playerName"></div>
                <div class="player-label">FORTNITE PLAYER</div>

            </div>

            <div class="offers">

                <!-- 1 : V-BUCKS VERT -->

                <article class="card green">

                    <img src="vbuck.png" alt="V-Bucks">

                    <h2>V-BUCKS</h2>

                    <a
                        class="price"
                        href="https://paypal.me/SH0PNOVA/8EUR"
                        target="_blank"
                        rel="noopener"
                    >8 €</a>

                </article>

                <!-- 2 : JETONS BLEU -->

                <article class="card blue">

                    <img src="jeton.png" alt="Jetons">

                    <h2>JETONS</h2>

                    <a
                        class="price"
                        href="https://paypal.me/SH0PNOVA/13EUR"
                        target="_blank"
                        rel="noopener"
                    >13 €</a>

                </article>

                <!-- 3 : LES DEUX ORANGE -->

                <article class="card orange">

                    <div class="combined">

                        <img src="vbuck.png" alt="V-Bucks">

                        <span class="plus">+</span>

                        <img src="jeton.png" alt="Jetons">

                    </div>

                    <h2>OFFRE COMPLÈTE</h2>

                    <a
                        class="price"
                        href="https://paypal.me/SH0PNOVA/17EUR"
                        target="_blank"
                        rel="noopener"
                    >17 €</a>

                </article>

            </div>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
