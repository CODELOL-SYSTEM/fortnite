
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 15% 20%, #063b2855, transparent 40%),
                radial-gradient(ellipse at 85% 80%, #063b5555, transparent 40%),
                #05080d;
            color: white;
            font-family: Arial, sans-serif;
            padding: 55px 25px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        /* RECHERCHE */

        .search-wrapper {
            max-width: 850px;
            margin: auto;
        }

        .search {
            display: flex;
            align-items: center;
            padding: 7px 10px 7px 22px;
            border-radius: 50px;
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow:
                0 0 25px rgba(0,180,255,0.12),
                inset 0 1px 2px rgba(255,255,255,0.2);
            transition: .3s;
        }

        .search:focus-within {
            border-color: #25d9a0;
            box-shadow: 0 0 30px #00e99c33;
        }

        .search input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 17px;
            padding: 15px 5px;
        }

        .search input::placeholder {
            color: #aeb7c5;
        }

        .search button {
            border: 1px solid #ffffff35;
            border-radius: 50px;
            padding: 13px 23px;
            background: rgba(255,255,255,.12);
            color: white;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(15px);
        }

        .search button:hover {
            background: rgba(255,255,255,.25);
        }

        /* RESULTAT */

        #result {
            display: none;
            margin-top: 55px;
            animation: appear .6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shop-layout {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 30px;
            align-items: center;
        }

        /* SKIN */

        .player {
            text-align: center;
        }

        .skin-circle {
            width: 190px;
            height: 190px;
            margin: auto;
            padding: 6px;
            border-radius: 50%;
            background: linear-gradient(135deg,#00e98c,#00aaff);
            box-shadow: 0 0 30px #00cfff55;
        }

        .skin-circle img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #101820;
        }

        .player-name {
            margin-top: 18px;
            font-size: 20px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .player-label {
            margin-top: 6px;
            font-size: 11px;
            color: #aab4c3;
            letter-spacing: 2px;
        }

        /* CARTES */

        .offers {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 17px;
        }

        .offer {
            position: relative;
            overflow: hidden;
            min-width: 0;
            padding: 22px 15px;
            text-align: center;
            border-radius: 23px;
            background: rgba(255,255,255,.055);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,.2);
            box-shadow:
                inset 0 1px 2px rgba(255,255,255,.2),
                0 15px 40px rgba(0,0,0,.3);
            transition: transform .3s, box-shadow .3s;
        }

        .offer:hover {
            transform: translateY(-7px);
        }

        .offer.green {
            border-color: #14e889aa;
            box-shadow: 0 0 25px #00e87920,
                        inset 0 1px 2px #ffffff30;
        }

        .offer.blue {
            border-color: #168dffaa;
            box-shadow: 0 0 25px #008cff20,
                        inset 0 1px 2px #ffffff30;
        }

        .offer.orange {
            border-color: #ff9e22aa;
            box-shadow: 0 0 25px #ff9e2220,
                        inset 0 1px 2px #ffffff30;
        }

        .offer::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            top: -110px;
            left: -70px;
            background: rgba(255,255,255,.10);
            filter: blur(35px);
            pointer-events: none;
        }

        .offer img {
            position: relative;
            width: 100%;
            height: 135px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 8px 12px #0008);
        }

        .offer h2 {
            font-size: 17px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .price {
            display: block;
            width: 100%;
            text-decoration: none;
            color: white;
            font-size: 25px;
            font-weight: 900;
            padding: 15px 5px;
            border-radius: 13px;
            border: 1px solid #ffffff55;
            backdrop-filter: blur(15px);
            transition: .25s;
        }

        .price:hover {
            transform: scale(1.04);
            filter: brightness(1.2);
        }

        .green .price {
            background: linear-gradient(135deg,#00d978,#008b48);
            box-shadow: 0 0 20px #00dc7744;
        }

        .blue .price {
            background: linear-gradient(135deg,#168fff,#0753b7);
            box-shadow: 0 0 20px #168fff44;
        }

        .orange .price {
            background: linear-gradient(135deg,#ffb52e,#e87908);
            box-shadow: 0 0 20px #ff9e2244;
        }

        /* OFFRE COMPLETE */

        .combined {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .combined img {
            width: 45%;
            height: 125px;
            margin: 0;
        }

        .plus {
            font-size: 30px;
            font-weight: 900;
            color: white;
        }

        @media(max-width: 850px) {
            .shop-layout {
                grid-template-columns: 1fr;
            }

            .player {
                margin-bottom: 5px;
            }

            .offers {
                grid-template-columns: repeat(2,1fr);
            }

            .offer:last-child {
                grid-column: 1 / -1;
            }
        }

        @media(max-width: 520px) {
            body {
                padding: 30px 14px;
            }

            .offers {
                grid-template-columns: 1fr;
            }

            .offer:last-child {
                grid-column: auto;
            }

            .offer {
                display: grid;
                grid-template-columns: 110px 1fr;
                align-items: center;
                gap: 8px 15px;
            }

            .offer img,
            .combined {
                grid-row: span 2;
                margin: 0;
            }

            .offer h2 {
                margin: 0;
            }

            .price {
                font-size: 22px;
                padding: 11px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="search-wrapper">
            <form class="search" id="searchForm">
                <input
                    type="text"
                    id="pseudo"
                    placeholder="Rechercher un pseudo Fortnite..."
                    autocomplete="off"
                    maxlength="30"
                    required
                >
                <button type="submit">RECHERCHER</button>
            </form>
        </div>

        <section id="result">

            <div class="shop-layout">

                <div class="player">
                    <div class="skin-circle">
                        <img
                            src="https://pbs.twimg.com/media/HEPyt5tagAApJHd?format=jpg&name=small"
                            alt="Skin Fortnite"
                        >
                    </div>

                    <div class="player-name" id="playerName"></div>
                    <div class="player-label">FORTNITE PLAYER</div>
                </div>

                <div class="offers">

                    <!-- OFFRE 1 : V-BUCKS -->

                    <article class="offer green">
                        <img src="vbuck.png" alt="V-Bucks">
                        <h2>V-BUCKS</h2>
                        <a
                            class="price"
                            href="https://paypal.me/SH0PNOVA/8EUR"
                            target="_blank"
                            rel="noopener"
                        >8 €</a>
                    </article>

                    <!-- OFFRE 2 : JETONS -->

                    <article class="offer blue">
                        <img src="jeton.png" alt="Jetons">
                        <h2>JETONS</h2>
                        <a
                            class="price"
                            href="https://paypal.me/SH0PNOVA/13EUR"
                            target="_blank"
                            rel="noopener"
                        >13 €</a>
                    </article>

                    <!-- OFFRE 3 : LES DEUX -->

                    <article class="offer orange">
                        <div class="combined">
                            <img src="vbuck.png" alt="V-Bucks">
                            <span class="plus">+</span>
                            <img src="jeton.png" alt="Jetons">
                        </div>

                        <h2>OFFRE COMPLÈTE</h2>

                        <a
                            class="price"
                            href="https://paypal.me/SH0PNOVA/17EUR"
                            target="_blank"
                            rel="noopener"
                        >17 €</a>
                    </article>

                </div>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
